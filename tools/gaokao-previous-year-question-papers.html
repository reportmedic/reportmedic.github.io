const YEARS=[...new Set(DB.map(q=>q.y))].sort((a,b)=>b-a);
const SECTIONS=['语文','数学','英语','物理','化学','生物','政治','历史','地理'];
const SEC_COLORS={'语文':'#ef4444','数学':'#3b82f6','英语':'#10b981','物理':'#f59e0b','化学':'#8b5cf6','生物':'#14b8a6','政治':'#e11d48','历史':'#a16207','地理':'#0891b2'};
const TOPICS_BY_SEC={
  All:[...new Set(DB.map(q=>q.topic))].sort(),
  '语文':['现代文阅读','古诗文阅读','语言文字运用','写作'],
  '数学':['函数与导数','三角函数','数列','立体几何','解析几何','概率与统计','集合与逻辑'],
  '英语':['阅读理解','完形填空','语法填空','写作','听力'],
  '物理':['力学','电磁学','光学','热学','原子物理'],
  '化学':['化学平衡','有机化学','无机化学','电化学','实验探究'],
  '生物':['细胞代谢','遗传学','生态学','分子生物学','实验设计'],
  '政治':['经济生活','政治生活','文化生活','哲学'],
  '历史':['中国古代史','中国近现代史','世界史'],
  '地理':['自然地理','人文地理','区域地理']
};

const PER_PAGE=10;
let activeSec='All',activeYear='All',activeTopic='All',activeDiffs=new Set(),showUnanswered=false;
let searchQ='',currentPage=1,answers={};

function animateCount(el,target){if(!el)return;let cur=0;const step=Math.max(1,Math.ceil(target/40));const iv=setInterval(()=>{cur+=step;if(cur>=target){cur=target;clearInterval(iv);}el.textContent=cur;},20);}

function init(){
  animateCount(document.getElementById('statTotal'),DB.length);
  document.getElementById('statYears').textContent=YEARS.length;
  const yc=document.getElementById('yearStrip');
  YEARS.forEach(y=>{
    const b=document.createElement('button');b.className='yr-chip';b.dataset.yr=y;b.textContent=y;b.onclick=()=>setYear(y);yc.appendChild(b);
    const o=document.createElement('option');o.value=y;o.textContent=y;document.getElementById('mobYear').appendChild(o);
  });
  buildTopicChips();render();
}
function setSec(s){activeSec=s;activeTopic='All';currentPage=1;document.querySelectorAll('.sec-chip').forEach(c=>c.classList.toggle('active',c.dataset.sec===s));document.getElementById('mobSubject').value=s;buildTopicChips();render();}
function setYear(y){activeYear=y;currentPage=1;document.querySelectorAll('.yr-chip').forEach(c=>c.classList.toggle('active',String(c.dataset.yr)===String(y)));document.getElementById('mobYear').value=y;render();}
function setTopic(t){activeTopic=t;currentPage=1;document.querySelectorAll('.topic-chip').forEach(c=>c.classList.toggle('active',c.dataset.t===t));render();}
function toggleDiff(d){if(activeDiffs.has(d))activeDiffs.delete(d);else activeDiffs.add(d);document.getElementById('btn'+({easy:'Easy',medium:'Medium',hard:'Hard'}[d]||d)).classList.toggle('active',activeDiffs.has(d));currentPage=1;render();}
function setMobDiff(d){activeDiffs=d==='All'?new Set():new Set([d]);currentPage=1;render();}
function toggleUnanswered(){showUnanswered=!showUnanswered;document.getElementById('btnUnanswered').classList.toggle('active',showUnanswered);currentPage=1;render();}
function resetAll(){activeSec='All';activeYear='All';activeTopic='All';activeDiffs=new Set();showUnanswered=false;searchQ='';document.getElementById('qSearch').value='';document.querySelectorAll('.sec-chip').forEach(c=>c.classList.toggle('active',c.dataset.sec==='All'));document.querySelectorAll('.yr-chip').forEach(c=>c.classList.toggle('active',c.dataset.yr==='All'));['Easy','Medium','Hard'].forEach(d=>document.getElementById('btn'+d).classList.remove('active'));document.getElementById('btnUnanswered').classList.remove('active');document.getElementById('mobSubject').value='All';document.getElementById('mobYear').value='All';document.getElementById('mobDiff').value='All';buildTopicChips();currentPage=1;render();}
function buildTopicChips(){const topics=activeSec==='All'?TOPICS_BY_SEC.All:(TOPICS_BY_SEC[activeSec]||[]);const tc=document.getElementById('topicChips');tc.innerHTML='';function mk(t,l){const b=document.createElement('button');b.className='topic-chip'+(activeTopic===t?' active':'');b.dataset.t=t;b.textContent=l||t;b.onclick=()=>setTopic(t);tc.appendChild(b);}mk('All','全部题型');topics.forEach(t=>mk(t));}
document.getElementById('qSearch').addEventListener('input',function(){searchQ=this.value.toLowerCase();currentPage=1;render();});
function getFiltered(){return DB.filter((q,idx)=>{if(activeSec!=='All'&&q.sec!==activeSec)return false;if(activeYear!=='All'&&q.y!=activeYear)return false;if(activeTopic!=='All'&&q.topic!==activeTopic)return false;if(activeDiffs.size&&!activeDiffs.has(q.diff))return false;if(showUnanswered&&answers[idx]!==undefined)return false;if(searchQ&&!q.q.toLowerCase().includes(searchQ)&&!q.topic.toLowerCase().includes(searchQ)&&!(q.opts||[]).some(o=>o.toLowerCase().includes(searchQ)))return false;return true;});}
function updateStats(){const a=Object.keys(answers).length;const c=Object.entries(answers).filter(([i,v])=>DB[i]&&DB[i].ans===v).length;document.getElementById('statAttempted').textContent=a;document.getElementById('statAccuracy').textContent=a?Math.round(c/a*100)+'%':'—';}
function render(){updateStats();const filtered=getFiltered();const total=filtered.length;const totalPages=Math.ceil(total/PER_PAGE)||1;currentPage=Math.min(currentPage,totalPages);const slice=filtered.slice((currentPage-1)*PER_PAGE,currentPage*PER_PAGE);document.getElementById('resultsInfo').textContent='共 '+total+' 道题目';const grid=document.getElementById('qGrid');const es=document.getElementById('emptyState');if(!slice.length){grid.innerHTML='';es.style.display='block';}else{es.style.display='none';grid.innerHTML=slice.map(q=>{const idx=DB.indexOf(q);const answered=answers[idx];const diffLabel={'easy':'简单','medium':'中等','hard':'困难'}[q.diff];return '<div class="q-card'+(answered!==undefined?' expanded':'')+'" data-sec="'+q.sec+'" id="card'+idx+'" onclick="expandCard(event,'+idx+')"><div class="q-top"><span class="q-year-badge">'+q.y+'年高考</span><span class="q-sec-badge">'+q.sec+'</span><span class="q-topic-badge">'+q.topic+'</span><span class="q-diff '+q.diff+'">'+diffLabel+'</span></div><div class="q-text">'+q.q+'</div>'+(answered!==undefined?renderOptions(q,idx):'<div class="q-opt-ph" style="margin-top:14px;padding:11px 16px;border-radius:12px;border:1px dashed rgba(239,68,68,.35);background:rgba(239,68,68,.05);font-size:13px;color:rgba(239,68,68,.85);font-weight:600;display:flex;align-items:center;gap:8px;cursor:pointer;">&#9654;&nbsp;点击查看选项</div>')+'<div class="q-explain'+(answered!==undefined?' show':'')+'" id="exp'+idx+'">'+(q.exp||'')+'</div></div>';}).join('');}renderPagination(total,totalPages);}
function renderOptions(q,idx){const answered=answers[idx];return '<div class="q-options">'+(q.opts||[]).map((o,oi)=>{let cls='q-opt';if(answered!==undefined){if(oi===q.ans)cls+=' correct';else if(oi===answered)cls+=' wrong';}return '<div class="'+cls+'" onclick="selectAnswer(event,'+idx+','+oi+')"><span class="ol">'+String.fromCharCode(65+oi)+'</span><span>'+o+'</span></div>';}).join('')+'</div>';}
function expandCard(e,idx){if(e.target.closest('.q-opt'))return;if(answers[idx]!==undefined)return;const ph=document.getElementById('card'+idx).querySelector('.q-opt-ph');if(ph)ph.outerHTML=renderOptions(DB[idx],idx);}
function selectAnswer(e,idx,chosen){e.stopPropagation();if(answers[idx]!==undefined)return;answers[idx]=chosen;const q=DB[idx];const correct=chosen===q.ans;spawnFX(e.clientX,e.clientY,correct);const card=document.getElementById('card'+idx);const od=card.querySelector('.q-options');if(od)od.outerHTML=renderOptions(q,idx);const exp=document.getElementById('exp'+idx);if(exp)exp.classList.add('show');card.classList.add('expanded');updateStats();}
function spawnFX(x,y,correct){const c=document.getElementById('fxContainer');const emojis=correct?['✅','🎉','⭐']:['❌'];for(let i=0;i<(correct?5:2);i++){const p=document.createElement('div');p.className='answer-particle';p.textContent=emojis[i%emojis.length];p.style.left=(x+Math.random()*60-30)+'px';p.style.top=(y+Math.random()*40-20)+'px';c.appendChild(p);setTimeout(()=>p.remove(),1300);}const popup=document.createElement('div');popup.className='answer-score-popup';popup.textContent=correct?'+1 ✓':'✗';popup.style.color=correct?'#34d399':'#f87171';popup.style.top=(y-30)+'px';c.appendChild(popup);setTimeout(()=>popup.remove(),1000);}
function renderPagination(total,totalPages){const pg=document.getElementById('pagination');if(totalPages<=1){pg.innerHTML='';return;}let h='<button class="pg-btn" onclick="goPage('+(currentPage-1)+')"'+(currentPage===1?' disabled':'')+'>‹</button>';const start=Math.max(1,currentPage-2),end=Math.min(totalPages,currentPage+2);for(let i=start;i<=end;i++){h+='<button class="pg-btn'+(i===currentPage?' active':'')+'" onclick="goPage('+i+')">'+i+'</button>';}h+='<button class="pg-btn" onclick="goPage('+(currentPage+1)+')"'+(currentPage===totalPages?' disabled':'')+'>›</button>';h+='<span class="pg-info">'+currentPage+' / '+totalPages+'</span>';pg.innerHTML=h;}
function goPage(p){currentPage=p;render();window.scrollTo({top:document.getElementById('qGrid').offsetTop-80,behavior:'smooth'});}
init();
</script>
