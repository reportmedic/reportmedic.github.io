<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nokia Snake</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

- { margin: 0; padding: 0; box-sizing: border-box; }

body {
background: #1a1a0e;
width: 100vw;
height: 100vh;
overflow: hidden;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
font-family: ‘Press Start 2P’, monospace;
}

/* Scanline overlay */
body::before {
content: ‘’;
position: fixed;
inset: 0;
background: repeating-linear-gradient(
0deg,
transparent,
transparent 2px,
rgba(0,0,0,0.08) 2px,
rgba(0,0,0,0.08) 4px
);
pointer-events: none;
z-index: 100;
}

/* CRT vignette */
body::after {
content: ‘’;
position: fixed;
inset: 0;
background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.7) 100%);
pointer-events: none;
z-index: 99;
}

#hud {
position: fixed;
top: 0; left: 0; right: 0;
display: flex;
justify-content: space-between;
align-items: center;
padding: 10px 20px;
background: rgba(26,26,14,0.95);
border-bottom: 2px solid #4a7a1e;
z-index: 50;
}

.hud-label {
font-size: 7px;
color: #4a7a1e;
letter-spacing: 2px;
text-transform: uppercase;
margin-bottom: 3px;
}

.hud-value {
font-size: 14px;
color: #9ade2e;
text-shadow: 0 0 10px #9ade2e, 0 0 20px #6ab020;
}

#canvas-wrap {
position: relative;
width: 100vw;
height: 100vh;
}

canvas {
display: block;
width: 100%;
height: 100%;
image-rendering: pixelated;
}

/* Overlay screens */
.screen {
position: fixed;
inset: 0;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
background: rgba(10,10,6,0.92);
z-index: 200;
gap: 20px;
}

.screen.hidden { display: none; }

.screen-title {
font-size: clamp(24px, 5vw, 48px);
color: #9ade2e;
text-shadow: 0 0 20px #9ade2e, 0 0 40px #6ab020;
letter-spacing: 4px;
animation: glow-pulse 2s ease-in-out infinite;
}

@keyframes glow-pulse {
0%, 100% { text-shadow: 0 0 20px #9ade2e, 0 0 40px #6ab020; }
50% { text-shadow: 0 0 40px #9ade2e, 0 0 80px #6ab020, 0 0 120px #4a9010; }
}

.screen-sub {
font-size: clamp(8px, 1.5vw, 12px);
color: #4a7a1e;
letter-spacing: 2px;
animation: blink 1.2s step-end infinite;
}

@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

.screen-score {
font-size: clamp(10px, 2vw, 16px);
color: #9ade2e;
margin-top: 10px;
}

/* Mobile D-pad */
#dpad {
position: fixed;
bottom: 20px;
right: 20px;
display: none;
grid-template-columns: repeat(3, 50px);
grid-template-rows: repeat(3, 50px);
gap: 4px;
z-index: 150;
}

.btn {
background: rgba(74,122,30,0.25);
border: 2px solid #4a7a1e;
color: #9ade2e;
font-size: 18px;
display: flex;
align-items: center;
justify-content: center;
border-radius: 6px;
cursor: pointer;
user-select: none;
-webkit-tap-highlight-color: transparent;
transition: background 0.1s;
}

.btn:active { background: rgba(154,222,46,0.3); }
.btn.empty { background: transparent; border: none; }

/* Speed selector */
#speed-wrap {
display: flex;
gap: 12px;
margin-top: 8px;
}

.speed-btn {
font-family: ‘Press Start 2P’, monospace;
font-size: 9px;
padding: 8px 14px;
background: transparent;
border: 2px solid #4a7a1e;
color: #4a7a1e;
cursor: pointer;
letter-spacing: 1px;
transition: all 0.15s;
}

.speed-btn.active, .speed-btn:hover {
background: #4a7a1e;
color: #1a1a0e;
box-shadow: 0 0 15px #4a7a1e;
}

#nokia-logo {
font-size: clamp(7px, 1.2vw, 10px);
color: #2a4a12;
letter-spacing: 6px;
margin-top: 30px;
}
</style>

</head>
<body>

<div id="hud">
  <div>
    <div class="hud-label">Score</div>
    <div class="hud-value" id="score">0</div>
  </div>
  <div style="text-align:center">
    <div class="hud-label">Nokia Snake</div>
    <div class="hud-value" id="level-display">LVL 1</div>
  </div>
  <div style="text-align:right">
    <div class="hud-label">Best</div>
    <div class="hud-value" id="best">0</div>
  </div>
</div>

<div id="canvas-wrap">
  <canvas id="c"></canvas>
</div>

<!-- Start Screen -->

<div class="screen" id="start-screen">
  <div class="screen-title">SNAKE</div>
  <div style="font-size:10px; color:#4a7a1e; letter-spacing:2px; margin-top:-10px">NOKIA EDITION</div>
  <div id="speed-wrap">
    <button class="speed-btn" data-speed="150">SLOW</button>
    <button class="speed-btn active" data-speed="100">MEDIUM</button>
    <button class="speed-btn" data-speed="60">FAST</button>
  </div>
  <div class="screen-sub" style="margin-top:10px">PRESS ANY KEY / TAP</div>
  <div id="nokia-logo">NOKIA</div>
</div>

<!-- Game Over Screen -->

<div class="screen hidden" id="gameover-screen">
  <div class="screen-title" style="font-size:clamp(20px,4vw,36px)">GAME OVER</div>
  <div class="screen-score">SCORE: <span id="final-score">0</span></div>
  <div class="screen-score" style="font-size:smaller; color:#4a7a1e">BEST: <span id="final-best">0</span></div>
  <div class="screen-sub" style="margin-top:20px">PRESS ANY KEY / TAP TO RESTART</div>
</div>

<!-- Mobile D-Pad -->

<div id="dpad">
  <div class="btn empty"></div>
  <div class="btn" id="btn-up">▲</div>
  <div class="btn empty"></div>
  <div class="btn" id="btn-left">◀</div>
  <div class="btn empty" style="background:rgba(74,122,30,0.08); border:2px solid #2a4a12; border-radius:6px;"></div>
  <div class="btn" id="btn-right">▶</div>
  <div class="btn empty"></div>
  <div class="btn" id="btn-down">▼</div>
  <div class="btn empty"></div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const startScreen = document.getElementById('start-screen');
const gameoverScreen = document.getElementById('gameover-screen');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const levelEl = document.getElementById('level-display');
const finalScore = document.getElementById('final-score');
const finalBest = document.getElementById('final-best');
const dpad = document.getElementById('dpad');

// Grid cell size in pixels
const CELL = 20;
let cols, rows, W, H;
let hudH;

function resize() {
  hudH = document.getElementById('hud').offsetHeight;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.floor(W / CELL) * CELL;
  canvas.height = Math.floor((H - hudH) / CELL) * CELL;
  // Set canvas-wrap to account for hud
  document.getElementById('canvas-wrap').style.paddingTop = hudH + 'px';
  document.getElementById('canvas-wrap').style.height = (H - hudH) + 'px';
  cols = canvas.width / CELL;
  rows = canvas.height / CELL;
}

// Detect mobile
function isMobile() {
  return /Android|iPhone|iPad|iPod|Touch/i.test(navigator.userAgent) || window.innerWidth < 600;
}

// Game state
let snake, dir, nextDir, food, score, best, gameState, gameLoop, speed;
let particles = [];
let selectedSpeed = 100;

best = parseInt(localStorage.getItem('snakeBest') || '0');
bestEl.textContent = best;

function initGame() {
  resize();
  const startX = Math.floor(cols / 2);
  const startY = Math.floor(rows / 2);
  snake = [
    {x: startX, y: startY},
    {x: startX - 1, y: startY},
    {x: startX - 2, y: startY},
  ];
  dir = {x: 1, y: 0};
  nextDir = {x: 1, y: 0};
  score = 0;
  particles = [];
  scoreEl.textContent = '0';
  levelEl.textContent = 'LVL 1';
  spawnFood();
  gameState = 'playing';
}

function spawnFood() {
  let pos;
  do {
    pos = {x: Math.floor(Math.random() * cols), y: Math.floor(Math.random() * rows)};
  } while (snake.some(s => s.x === pos.x && s.y === pos.y));
  food = pos;
}

function getLevel(s) { return Math.floor(s / 5) + 1; }

function step() {
  dir = {...nextDir};
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  // Wall wrapping (Nokia style)
  head.x = (head.x + cols) % cols;
  head.y = (head.y + rows) % rows;

  // Self collision
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    endGame(); return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = score;
    levelEl.textContent = 'LVL ' + getLevel(score);
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      localStorage.setItem('snakeBest', best);
    }
    spawnEatParticles(food.x * CELL + CELL/2, food.y * CELL + CELL/2);
    spawnFood();
    // Speed up slightly with level
    clearInterval(gameLoop);
    const newSpeed = Math.max(40, selectedSpeed - getLevel(score) * 5);
    gameLoop = setInterval(tick, newSpeed);
  } else {
    snake.pop();
  }
}

function spawnEatParticles(px, py) {
  for (let i = 0; i < 8; i++) {
    particles.push({
      x: px, y: py,
      vx: (Math.random() - 0.5) * 5,
      vy: (Math.random() - 0.5) * 5,
      life: 1,
      size: Math.random() * 4 + 2
    });
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Background grid
  ctx.strokeStyle = 'rgba(74,122,30,0.08)';
  ctx.lineWidth = 0.5;
  for (let x = 0; x <= cols; x++) {
    ctx.beginPath(); ctx.moveTo(x*CELL,0); ctx.lineTo(x*CELL,canvas.height); ctx.stroke();
  }
  for (let y = 0; y <= rows; y++) {
    ctx.beginPath(); ctx.moveTo(0,y*CELL); ctx.lineTo(canvas.width,y*CELL); ctx.stroke();
  }

  // Snake
  snake.forEach((seg, i) => {
    const t = i / snake.length;
    const alpha = 1 - t * 0.5;
    const brightness = 1 - t * 0.4;

    ctx.fillStyle = `rgba(${Math.floor(154*brightness)}, ${Math.floor(222*brightness)}, ${Math.floor(46*brightness)}, ${alpha})`;
    const pad = i === 0 ? 1 : 2;
    ctx.fillRect(seg.x * CELL + pad, seg.y * CELL + pad, CELL - pad*2, CELL - pad*2);

    // Head glow
    if (i === 0) {
      ctx.shadowColor = '#9ade2e';
      ctx.shadowBlur = 12;
      ctx.fillStyle = '#c8f050';
      ctx.fillRect(seg.x * CELL + 3, seg.y * CELL + 3, CELL - 6, CELL - 6);
      ctx.shadowBlur = 0;

      // Eyes
      ctx.fillStyle = '#1a1a0e';
      const ex = dir.x, ey = dir.y;
      const cx = seg.x * CELL + CELL/2, cy = seg.y * CELL + CELL/2;
      const eyeSize = 2.5;
      const eyeOffset = 3;
      if (ex !== 0) {
        ctx.fillRect(cx + ex*3 - eyeSize/2, cy - eyeOffset - eyeSize/2, eyeSize, eyeSize);
        ctx.fillRect(cx + ex*3 - eyeSize/2, cy + eyeOffset - eyeSize/2, eyeSize, eyeSize);
      } else {
        ctx.fillRect(cx - eyeOffset - eyeSize/2, cy + ey*3 - eyeSize/2, eyeSize, eyeSize);
        ctx.fillRect(cx + eyeOffset - eyeSize/2, cy + ey*3 - eyeSize/2, eyeSize, eyeSize);
      }
    }
  });

  // Food - pulsing
  const pulse = 0.7 + 0.3 * Math.sin(Date.now() / 200);
  ctx.shadowColor = '#ff6b35';
  ctx.shadowBlur = 15 * pulse;
  ctx.fillStyle = `rgba(255, 107, 53, ${pulse})`;
  const fp = 3;
  ctx.fillRect(food.x * CELL + fp, food.y * CELL + fp, CELL - fp*2, CELL - fp*2);
  ctx.shadowBlur = 0;

  // Food inner
  ctx.fillStyle = '#ffaa7a';
  const fp2 = 6;
  ctx.fillRect(food.x * CELL + fp2, food.y * CELL + fp2, CELL - fp2*2, CELL - fp2*2);

  // Particles
  particles.forEach(p => {
    ctx.fillStyle = `rgba(255, 180, 80, ${p.life})`;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  });
}

function updateParticles() {
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.2;
    p.life -= 0.06;
    p.size *= 0.95;
  });
}

function tick() {
  if (gameState !== 'playing') return;
  step();
  updateParticles();
  draw();
}

function endGame() {
  gameState = 'gameover';
  clearInterval(gameLoop);
  finalScore.textContent = score;
  finalBest.textContent = best;
  gameoverScreen.classList.remove('hidden');
}

function startGame() {
  startScreen.classList.add('hidden');
  gameoverScreen.classList.add('hidden');
  initGame();
  clearInterval(gameLoop);
  gameLoop = setInterval(tick, selectedSpeed);
  draw();
}

// Controls
document.addEventListener('keydown', e => {
  const map = {
    ArrowUp: {x:0,y:-1}, ArrowDown: {x:0,y:1},
    ArrowLeft: {x:-1,y:0}, ArrowRight: {x:1,y:0},
    w: {x:0,y:-1}, s: {x:0,y:1}, a: {x:-1,y:0}, d: {x:1,y:0}
  };

  // Prevent page scrolling on arrow keys always
  if (map[e.key]) e.preventDefault();

  if (gameState !== 'playing') {
    // Start game first, direction keys take effect from NEXT frame
    startGame();
    return;
  }

  if (map[e.key]) {
    const d = map[e.key];
    // Prevent reversing into self
    if (!(d.x === -dir.x && d.y === -dir.y)) nextDir = d;
  }
});

// Touch swipe — only on the canvas area, not on D-pad
let touchStart = null;
let swipeBlocked = false;

document.addEventListener('touchstart', e => {
  // If touch originates inside the dpad, block swipe detection entirely
  if (e.target.closest('#dpad')) { swipeBlocked = true; return; }
  swipeBlocked = false;
  touchStart = {x: e.touches[0].clientX, y: e.touches[0].clientY};
}, {passive: true});

document.addEventListener('touchend', e => {
  if (swipeBlocked) { swipeBlocked = false; return; }
  if (!touchStart) return;
  const dx = e.changedTouches[0].clientX - touchStart.x;
  const dy = e.changedTouches[0].clientY - touchStart.y;
  touchStart = null;

  // Tap to start
  if (Math.abs(dx) < 10 && Math.abs(dy) < 10) {
    if (gameState !== 'playing') { startGame(); }
    return;
  }
  if (gameState !== 'playing') { startGame(); return; }

  // Need a minimum swipe distance of 20px to register
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;

  if (Math.abs(dx) > Math.abs(dy)) {
    const d = dx > 0 ? {x:1,y:0} : {x:-1,y:0};
    if (!(d.x === -dir.x && d.y === -dir.y)) nextDir = d;
  } else {
    const d = dy > 0 ? {x:0,y:1} : {x:0,y:-1};
    if (!(d.x === -dir.x && d.y === -dir.y)) nextDir = d;
  }
}, {passive: true});

// D-pad buttons — stopPropagation so swipe handler never sees these touches
function setDir(dx, dy) {
  if (gameState !== 'playing') { startGame(); return; }
  const d = {x:dx, y:dy};
  if (!(d.x === -dir.x && d.y === -dir.y)) nextDir = d;
}
document.getElementById('btn-up').addEventListener('touchstart',    e => { e.preventDefault(); e.stopPropagation(); setDir(0,-1); });
document.getElementById('btn-down').addEventListener('touchstart',  e => { e.preventDefault(); e.stopPropagation(); setDir(0,1); });
document.getElementById('btn-left').addEventListener('touchstart',  e => { e.preventDefault(); e.stopPropagation(); setDir(-1,0); });
document.getElementById('btn-right').addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); setDir(1,0); });

// Speed buttons
document.querySelectorAll('.speed-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedSpeed = parseInt(btn.dataset.speed);
  });
});

// Show dpad on mobile
window.addEventListener('resize', () => {
  resize();
  if (gameState === 'playing') draw();
});

if (isMobile() || window.innerWidth < 800) {
  dpad.style.display = 'grid';
}

// Animation loop for idle glow on screens
function animLoop() {
  if (gameState !== 'playing') {
    requestAnimationFrame(animLoop);
    return;
  }
  requestAnimationFrame(animLoop);
}
animLoop();

// Init resize
resize();
</script>

</body>
</html>
