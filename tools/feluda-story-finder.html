<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',ui-sans-serif,system-ui,sans-serif;}

/* -- Animated Background -- */
.bg-mesh{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;}
.bg-mesh .strand{position:absolute;border-radius:50%;filter:blur(120px);opacity:.12;animation:meshDrift 20s ease-in-out infinite alternate;}
.bg-mesh .strand:nth-child(1){width:700px;height:500px;background:linear-gradient(135deg,#6ea8ff,#7cf7d4);top:-15%;right:-10%;}
.bg-mesh .strand:nth-child(2){width:500px;height:500px;background:linear-gradient(135deg,#a78bfa,#6ea8ff);bottom:-10%;left:-5%;animation-delay:-7s;animation-duration:25s;}
.bg-mesh .strand:nth-child(3){width:400px;height:300px;background:linear-gradient(135deg,#7cf7d4,#f59e0b);top:50%;left:40%;animation-delay:-14s;animation-duration:28s;}
@keyframes meshDrift{0%{transform:translate(0,0) rotate(0deg) scale(1);}100%{transform:translate(40px,-30px) rotate(15deg) scale(1.1);}}

/* -- Tabs Nav -- */
.tab-nav{display:flex;gap:4px;padding:4px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);border-radius:16px;margin-bottom:24px;overflow-x:auto;}
.tab-btn{flex:1;min-width:fit-content;padding:12px 20px;border-radius:12px;border:none;background:transparent;color:var(--muted);font-size:13.5px;font-weight:700;cursor:pointer;transition:all .2s;font-family:inherit;white-space:nowrap;letter-spacing:.01em;}
.tab-btn:hover{color:var(--text);background:rgba(255,255,255,.04);}
.tab-btn.active{background:linear-gradient(135deg,rgba(110,168,255,.18),rgba(124,247,212,.12));color:var(--text);box-shadow:0 2px 16px rgba(110,168,255,.12),inset 0 1px 0 rgba(255,255,255,.06);}

/* -- Views -- */
.view{display:none;}
.view.active{display:block;}

/* -- Hero -- */
.daily-hero{text-align:center;padding:32px 0 16px;}
.daily-hero h1{font-size:clamp(26px,4.5vw,38px);font-weight:700;letter-spacing:-.02em;line-height:1.15;}
.daily-hero h1 .grad{background:linear-gradient(135deg,#6ea8ff,#7cf7d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.daily-hero .sub{color:var(--muted);font-size:14.5px;margin-top:10px;line-height:1.5;letter-spacing:.01em;}

/* -- Streak Banner -- */
.streak-bar{display:flex;align-items:center;justify-content:center;gap:14px;margin:16px 0 26px;flex-wrap:wrap;}
.streak-pill{display:flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);backdrop-filter:blur(8px);font-size:13px;font-weight:600;transition:transform .15s;}
.streak-pill:hover{transform:translateY(-1px);}
.streak-pill .fire{font-size:20px;}
.streak-pill .sval{font-size:18px;font-weight:700;background:linear-gradient(135deg,#f59e0b,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.streak-pill .sval.green{background:linear-gradient(135deg,#10b981,#7cf7d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.streak-dots{display:flex;gap:5px;}
.streak-dots .dot{width:30px;height:30px;border-radius:9px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.025);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;transition:all .2s;color:var(--muted);}
.streak-dots .dot.done{background:linear-gradient(135deg,rgba(16,185,129,.15),rgba(124,247,212,.1));border-color:rgba(16,185,129,.25);color:#34d399;}
.streak-dots .dot.today{border-color:rgba(110,168,255,.45);box-shadow:0 0 14px rgba(110,168,255,.15);}

/* -- Phase Filter -- */
.phase-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;align-items:center;}
.phase-filter .pf-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:4px;}
.pf-btn{padding:6px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;transition:all .18s;font-family:inherit;}
.pf-btn:hover{border-color:rgba(255,255,255,.22);color:var(--text);}
.pf-btn.active{background:rgba(110,168,255,.12);border-color:rgba(110,168,255,.35);color:#6ea8ff;}

/* -- Quiz Container -- */
.quiz-panel{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);border-radius:22px;padding:26px;backdrop-filter:blur(8px);position:relative;overflow:hidden;max-width:780px;margin:0 auto;}
.quiz-panel::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(124,247,212,.3),rgba(110,168,255,.3),transparent);}
.quiz-progress{display:flex;gap:4px;margin-bottom:18px;}
.quiz-progress .pip{flex:1;height:5px;border-radius:999px;background:rgba(255,255,255,.06);transition:background .3s;}
.quiz-progress .pip.done{background:linear-gradient(90deg,#10b981,#7cf7d4);}
.quiz-progress .pip.wrong{background:#ef4444;}
.quiz-progress .pip.current{background:rgba(110,168,255,.4);animation:pipPulse 1.5s ease infinite;}
@keyframes pipPulse{0%,100%{opacity:1;}50%{opacity:.4;}}

.quiz-meta{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.quiz-meta .qnum{font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;background:rgba(110,168,255,.1);color:#6ea8ff;border:1px solid rgba(110,168,255,.15);}
.quiz-meta .qsub{font-size:12px;font-weight:600;padding:5px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.08);color:var(--muted);}
.quiz-meta .qphase{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid rgba(124,247,212,.2);background:rgba(124,247,212,.06);color:#7cf7d4;}
.quiz-meta .qdiff{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;}
.quiz-meta .qdiff.easy{border:1px solid rgba(52,211,153,.2);background:rgba(52,211,153,.06);color:#34d399;}
.quiz-meta .qdiff.medium{border:1px solid rgba(251,191,36,.2);background:rgba(251,191,36,.06);color:#fbbf24;}
.quiz-meta .qdiff.hard{border:1px solid rgba(248,113,113,.2);background:rgba(248,113,113,.06);color:#f87171;}
.quiz-meta .timer{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px;}
.quiz-meta .timer svg{color:rgba(110,168,255,.6);}

.quiz-question{font-size:16.5px;line-height:1.7;font-weight:600;margin-bottom:18px;letter-spacing:.005em;}
.quiz-opts{display:flex;flex-direction:column;gap:10px;}
.qo{padding:14px 16px;border-radius:14px;border:1.5px solid rgba(255,255,255,.08);background:rgba(255,255,255,.025);cursor:pointer;transition:all .15s;display:flex;align-items:flex-start;gap:12px;font-size:14px;line-height:1.5;}
.qo:hover{border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.05);transform:translateX(4px);}
.qo .letter{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;transition:all .2s;}
.qo.selected{border-color:rgba(110,168,255,.5);background:rgba(110,168,255,.06);}
.qo.selected .letter{border-color:#6ea8ff;background:#6ea8ff;color:#061021;}
.qo.correct{border-color:rgba(16,185,129,.45);background:rgba(16,185,129,.06);}
.qo.correct .letter{border-color:#10b981;background:#10b981;color:#061021;}
.qo.wrong{border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.05);}
.qo.wrong .letter{border-color:#ef4444;background:#ef4444;color:#fff;}
.qo.disabled{pointer-events:none;opacity:.65;}
.qo.correct.disabled,.qo.wrong.disabled{opacity:1;}

.quiz-explain{margin-top:14px;padding:16px 18px;border-radius:16px;background:rgba(124,247,212,.035);border:1px solid rgba(124,247,212,.1);font-size:13.5px;line-height:1.7;color:var(--muted);display:none;}
.quiz-explain.show{display:block;animation:slideUp .3s cubic-bezier(.4,0,.2,1);}
@keyframes slideUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

.quiz-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
.qa-btn{padding:12px 24px;border-radius:14px;border:none;font-size:14px;font-weight:700;cursor:pointer;transition:all .18s;font-family:inherit;letter-spacing:.01em;}
.qa-btn.primary{background:linear-gradient(135deg,#6ea8ff,#7cf7d4);color:#061021;}
.qa-btn.primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(110,168,255,.25);}
.qa-btn.ghost{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:var(--text);}
.qa-btn.ghost:hover{border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.08);}

/* -- Results Card -- */
.result-card{text-align:center;padding:40px 20px;max-width:520px;margin:0 auto;}
.result-card .big-score{font-size:64px;font-weight:700;line-height:1;margin-bottom:8px;}
.result-card .big-score.great{background:linear-gradient(135deg,#10b981,#7cf7d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.result-card .big-score.ok{background:linear-gradient(135deg,#f59e0b,#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.result-card .big-score.poor{background:linear-gradient(135deg,#ef4444,#f87171);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.result-card .rlabel{color:var(--muted);font-size:14px;margin-bottom:20px;}
.result-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0;}
.result-mini .rm{padding:16px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06);}
.result-mini .rm .rv{font-size:20px;font-weight:700;}
.result-mini .rm .rl{font-size:11px;color:var(--muted);margin-top:4px;}

/* -- Subject Practice Grid -- */
.subj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:18px;}
.subj-card{padding:20px;border-radius:18px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.03);cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
.subj-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:3px 3px 0 0;}
.subj-card:hover{border-color:rgba(255,255,255,.18);transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.25);}
.subj-card .sc-icon{font-size:30px;margin-bottom:10px;}
.subj-card .sc-name{font-size:14.5px;font-weight:700;margin-bottom:4px;letter-spacing:.01em;}
.subj-card .sc-count{font-size:12px;color:var(--muted);}
.subj-card .sc-bar{height:4px;border-radius:999px;background:rgba(255,255,255,.06);margin-top:12px;overflow:hidden;}
.subj-card .sc-fill{height:100%;border-radius:999px;transition:width .5s ease;}
.fl-card{border:1px solid var(--border);border-radius:16px;background:rgba(255,255,255,.03);padding:17px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
.fl-card:hover{border-color:rgba(255,255,255,.2);transform:translateY(-2px);}
.fl-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--brand);}
.fl-card.read::before{background:#34d399;}
.fl-bn{font-size:16px;font-weight:700;line-height:1.55;}
.fl-en{font-size:13px;color:var(--muted);margin-top:3px;font-style:italic;}
.fl-meta{font-size:11.5px;color:var(--muted);margin-top:8px;}
.fl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;}
.fl-detail{border:1px solid var(--border);border-radius:18px;background:rgba(255,255,255,.03);padding:22px;margin-top:18px;}
.fl-row{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:14px;line-height:1.75;}
.fl-row:last-child{border-bottom:0;}
.fl-row .lbl{font-weight:700;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding-top:2px;}
@media(max-width:640px){.fl-row{grid-template-columns:1fr;gap:4px;}}
.fl-tag{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--muted);margin:3px 5px 0 0;}
.fl-note{border-left:3px solid var(--brand);background:rgba(255,255,255,.04);border-radius:0 12px 12px 0;padding:13px 15px;font-size:13.5px;line-height:1.75;}
.ri-cell{padding:12px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.03);text-align:center;}
.ri-cell .cv{font-size:19px;font-weight:800;}
.ri-cell .cl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-top:3px;}
.bn-text{line-height:1.9;}
.ri-warnbox{border-left:3px solid #ffb35c;background:rgba(255,179,92,.07);border-radius:0 12px 12px 0;padding:14px 16px;font-size:13.5px;line-height:1.75;}
.lit-detail{border:1px solid var(--border);border-radius:18px;background:rgba(255,255,255,.03);padding:22px;margin-top:18px;}
.lit-detail h3{font-size:20px;margin-bottom:4px;}
.lit-detail .meta{font-size:12.5px;color:var(--muted);margin-bottom:14px;}
.lit-detail p{line-height:1.75;font-size:14.5px;margin-bottom:12px;}
.lit-row{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:14px;line-height:1.7;}
.lit-row:last-child{border-bottom:0;}
.lit-row .lbl{font-weight:700;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding-top:2px;}
@media(max-width:640px){.lit-row{grid-template-columns:1fr;gap:4px;}}
.cmp-grid{display:grid;grid-template-columns:170px 1fr 1fr;gap:10px;align-items:start;}
.cmp-grid > div{padding:11px 12px;border-bottom:1px solid rgba(255,255,255,.07);font-size:14px;line-height:1.7;}
.cmp-grid .cmp-lbl{font-weight:700;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;}
.cmp-grid .cmp-head{font-weight:700;font-size:15px;color:var(--text);border-bottom:1px solid rgba(255,255,255,.14);}
@media(max-width:760px){.cmp-grid{grid-template-columns:1fr;}.cmp-grid .cmp-lbl{padding-bottom:0;border-bottom:0;}}
.theme-chip{display:inline-block;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:rgba(110,168,255,.10);border:1px solid rgba(110,168,255,.20);color:#6ea8ff;margin:3px 5px 3px 0;cursor:pointer;}
.theme-chip.on{background:var(--brand);border-color:var(--brand);color:#08111f;}

/* -- Analytics Dashboard -- */
.analytics-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px;}
@media(max-width:700px){.analytics-grid{grid-template-columns:1fr;}}
.an-card{padding:20px;border-radius:18px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.03);backdrop-filter:blur(6px);position:relative;overflow:hidden;}
.an-card::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);}
.an-card.full{grid-column:1/-1;}
.an-card h3{font-size:12.5px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);}
.an-card h3 .icon{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;}

/* -- Overview Strip -- */
.overview-strip{display:flex;align-items:center;gap:24px;}
.ov-ring{position:relative;flex-shrink:0;width:100px;height:100px;}
.ov-ring canvas{width:100px;height:100px;}
.ov-ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ov-ring-label .rv{font-size:22px;font-weight:700;line-height:1;}
.ov-ring-label .rl{font-size:9px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-top:2px;}
.ov-stats{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.ov-stat{padding:12px 10px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);text-align:center;}
.ov-stat .os-val{font-size:18px;font-weight:700;line-height:1.2;font-family:'JetBrains Mono',monospace;}
.ov-stat .os-label{font-size:10px;color:var(--muted);margin-top:3px;letter-spacing:.03em;text-transform:uppercase;font-weight:600;}
@media(max-width:600px){
  .overview-strip{flex-direction:column;gap:16px;}
  .ov-stats{grid-template-columns:repeat(3,1fr);width:100%;}
}

/* -- Subject accuracy bars -- */
.sub-bars{display:flex;flex-direction:column;gap:10px;}
.sb-row{display:flex;align-items:center;gap:10px;}
.sb-label{width:105px;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sb-track{flex:1;height:24px;border-radius:8px;background:rgba(255,255,255,.05);overflow:hidden;position:relative;}
.sb-fill{height:100%;border-radius:8px;display:flex;align-items:center;padding-left:8px;font-size:11px;font-weight:700;color:#061021;transition:width .6s cubic-bezier(.4,0,.2,1);min-width:fit-content;}
.sb-val{font-size:12px;font-weight:700;width:46px;text-align:right;color:var(--muted);font-family:'JetBrains Mono',monospace;}

/* -- Trend Chart -- */
.trend-wrap{position:relative;min-height:220px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.trend-wrap::-webkit-scrollbar{height:4px;}.trend-wrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:4px;}
.trend-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:200px;gap:10px;color:var(--muted);text-align:center;}
.trend-empty .te-icon{font-size:40px;opacity:.4;}
.trend-empty .te-msg{font-size:13px;line-height:1.5;max-width:320px;}
.trend-bar-chart{display:flex;align-items:flex-end;gap:8px;height:180px;padding:10px 0;min-width:min-content;}
.trend-col{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:48px;width:48px;flex-shrink:0;}
.trend-bar-outer{width:100%;flex:1;display:flex;flex-direction:column;justify-content:flex-end;position:relative;}
.trend-bar{width:100%;border-radius:6px 6px 2px 2px;transition:height .5s cubic-bezier(.4,0,.2,1);position:relative;min-height:4px;}
.trend-bar:hover{filter:brightness(1.2);}
.trend-bar .tb-val{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;color:var(--text);opacity:0;transition:opacity .15s;white-space:nowrap;font-family:'JetBrains Mono',monospace;}
.trend-bar:hover .tb-val{opacity:1;}
.trend-label{font-size:10px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-align:center;}
.trend-mode-label{font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:.04em;}
.trend-mode-label.daily{background:rgba(110,168,255,.12);color:#6ea8ff;}
.trend-mode-label.practice{background:rgba(139,92,246,.12);color:#a78bfa;}

/* -- Mastery Dashboard -- */
.mastery-wrap{margin-top:8px;}
.mastery-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
.m-stat{padding:12px 8px;border-radius:12px;text-align:center;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);}
.m-stat .ms-val{font-size:22px;font-weight:800;margin-bottom:2px;}
.m-stat .ms-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700;}
.m-stat.green .ms-val{color:#34d399;} .m-stat.yellow .ms-val{color:#fbbf24;} .m-stat.red .ms-val{color:#f87171;} .m-stat.blue .ms-val{color:#6ea8ff;} .m-stat.purple .ms-val{color:#a78bfa;}
.coverage-ring{display:flex;align-items:center;gap:16px;padding:14px;border-radius:14px;background:rgba(255,255,255,.015);border:1px solid rgba(255,255,255,.04);margin-bottom:14px;overflow:hidden;}
.cov-canvas{width:90px;height:90px;flex-shrink:0;}
.cov-info{flex:1;min-width:0;overflow:hidden;}
.cov-title{font-size:13px;font-weight:700;color:var(--fg);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cov-sub{font-size:11px;color:var(--muted);line-height:1.6;word-break:break-word;}
.subj-mastery{margin-top:14px;}
.sm-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:8px;}
.sm-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px;}
.sm-icon{font-size:14px;width:20px;text-align:center;}
.sm-name{width:70px;font-weight:600;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sm-bar{flex:1;height:8px;background:rgba(255,255,255,.04);border-radius:4px;overflow:hidden;position:relative;}
.sm-fill{height:100%;border-radius:4px;transition:width .6s ease;}
.sm-pct{width:34px;text-align:right;font-weight:700;font-size:11px;}

/* -- Passage block for reading items -- */
.quiz-passage{padding:14px 16px;border-radius:14px;background:rgba(110,168,255,.04);border:1px solid rgba(110,168,255,.10);font-size:14.5px;line-height:1.75;color:var(--muted);margin-bottom:14px;}
.quiz-passage em{color:var(--text);font-style:italic;}

/* -- Difficulty chips -- */
.diff-dist{display:flex;gap:10px;margin-top:6px;}
.diff-chip{flex:1;padding:14px 10px;border-radius:14px;text-align:center;border:1px solid rgba(255,255,255,.05);background:rgba(255,255,255,.02);}
.diff-chip .dc-val{font-size:20px;font-weight:700;margin-bottom:2px;}
.diff-chip .dc-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700;}
.diff-chip.easy .dc-val{color:#34d399;}
.diff-chip.medium .dc-val{color:#fbbf24;}
.diff-chip.hard .dc-val{color:#f87171;}

/* -- Session History -- */
.hist-list{display:flex;flex-direction:column;gap:6px;max-height:240px;overflow-y:auto;padding-right:4px;}
.hist-list::-webkit-scrollbar{width:4px;}
.hist-list::-webkit-scrollbar-track{background:transparent;}
.hist-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:4px;}
.hist-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.04);font-size:12px;transition:background .1s;}
.hist-row:hover{background:rgba(255,255,255,.04);}
.hist-date{font-weight:600;min-width:80px;font-family:'JetBrains Mono',monospace;font-size:11px;}
.hist-mode{padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
.hist-mode.daily{background:rgba(110,168,255,.1);color:#6ea8ff;}
.hist-mode.practice{background:rgba(139,92,246,.1);color:#a78bfa;}
.hist-score{margin-left:auto;font-weight:700;font-family:'JetBrains Mono',monospace;}
.hist-detail{color:var(--muted);font-size:11px;}

/* -- Reset Button -- */
.reset-zone{margin-top:20px;text-align:center;}
.reset-btn{padding:10px 20px;border-radius:12px;border:1px solid rgba(239,68,68,.2);background:rgba(239,68,68,.06);color:#f87171;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;font-family:inherit;}
.reset-btn:hover{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.35);}

/* -- Tab label responsive -- */
.tab-short{display:none;}
@media(max-width:540px){.tab-full{display:none;}.tab-short{display:inline;}}
@media(max-width:640px){
  .quiz-panel{padding:16px;}
  .streak-bar{gap:10px;}
  .subj-grid{grid-template-columns:1fr 1fr;}
  .diff-dist{flex-wrap:wrap;}
  .diff-chip{min-width:calc(50% - 5px);}
  .mastery-stats{grid-template-columns:repeat(3,1fr);gap:6px;}
  .coverage-ring{flex-direction:column;text-align:center;}
  .sm-name{width:55px;font-size:10px;}
  .tab-nav{overflow-x:hidden;}
  .hide-mobile{display:none!important;}
}

.anim-up{opacity:0;transform:translateY(20px);animation:animUp .5s ease forwards;}
@keyframes animUp{to{opacity:1;transform:translateY(0);}}
.d1{animation-delay:.1s}.d2{animation-delay:.2s}.d3{animation-delay:.3s}

.btn.primary{background:linear-gradient(135deg,#6ea8ff,#7cf7d4);color:#061021;padding:10px 20px;border-radius:10px;border:none;font-size:13.5px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;letter-spacing:.01em;transition:all .18s;}
.btn.primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(110,168,255,.25);}
</style>

  var R = get(K_R, {});
  var fType="All", fRegion="All", openId=null;

  function t(k){ return (FL.i18n[L]||FL.i18n.en)[k] || k; }
  function sTitle(s){ return L==="bn" ? s.bn : s.en; }
  function sAlt(s){ return L==="bn" ? s.en : s.bn; }
  function sSet(s){ return L==="bn" ? s.setBn : s.setEn; }
  function sPrem(s){ return L==="bn" ? s.pBn : s.pEn; }
  function sNote(s){ return L==="bn" ? s.nBn : s.nEn; }
  function rName(id){ for(var i=0;i<FL.regions.length;i++){ if(FL.regions[i].id===id) return L==="bn"?FL.regions[i].bn:FL.regions[i].en; } return id; }
  function pName(id){ for(var i=0;i<FL.people.length;i++){ if(FL.people[i].id===id) return L==="bn"?FL.people[i].bn:FL.people[i].en; } return id; }
  function typeName(x){ return x==="novel" ? t("novel") : t("story"); }
  function storyById(id){ for(var i=0;i<FL.stories.length;i++){ if(FL.stories[i].id===id) return FL.stories[i]; } return null; }

  /* ---------- language ---------- */
  function applyLang(){
    document.documentElement.setAttribute("lang", L);
    document.querySelectorAll("[data-i18n]").forEach(function(el){ el.textContent = t(el.getAttribute("data-i18n")); });
    document.querySelectorAll("[data-i18n-html]").forEach(function(el){ el.innerHTML = t(el.getAttribute("data-i18n-html")); });
    $("langToggle").textContent = L==="bn" ? "English" : "বাংলা";
    $("flFind").setAttribute("placeholder", t("search"));
    renderFilters(); renderGrid(); renderOrders(); renderPeople(); renderProgress();
    if(openId) openStory(openId);
  }

  /* ---------- filters ---------- */
  function renderFilters(){
    $("typeBtns").innerHTML =
      '<button class="pf-btn'+(fType==="All"?" active":"")+'" data-ty="All">'+esc(t("all"))+"</button>"+
      '<button class="pf-btn'+(fType==="novel"?" active":"")+'" data-ty="novel">'+esc(t("novel"))+"</button>"+
      '<button class="pf-btn'+(fType==="story"?" active":"")+'" data-ty="story">'+esc(t("story"))+"</button>";
    $("regionBtns").innerHTML =
      '<button class="pf-btn'+(fRegion==="All"?" active":"")+'" data-rg="All">'+esc(t("all"))+"</button>"+
      FL.regions.map(function(r){
        return '<button class="pf-btn'+(fRegion===r.id?" active":"")+'" data-rg="'+esc(r.id)+'">'+
          esc(L==="bn"?r.bn:r.en)+"</button>";
      }).join("");
    $("typeBtns").querySelectorAll("[data-ty]").forEach(function(b){
      b.addEventListener("click", function(){ fType=b.getAttribute("data-ty"); renderFilters(); renderGrid(); });
    });
    $("regionBtns").querySelectorAll("[data-rg]").forEach(function(b){
      b.addEventListener("click", function(){ fRegion=b.getAttribute("data-rg"); renderFilters(); renderGrid(); });
    });
  }

  /* ---------- grid ---------- */
  function renderGrid(){
    var q=($("flFind").value||"").toLowerCase();
    var list=FL.stories.filter(function(s){
      if(fType!=="All" && s.type!==fType) return false;
      if(fRegion!=="All" && s.r!==fRegion) return false;
      if(q){
        var hay=(s.bn+" "+s.en+" "+s.setBn+" "+s.setEn+" "+s.pBn+" "+s.pEn+" "+
                 s.feat.map(function(f){return pName(f);}).join(" ")+" "+s.y).toLowerCase();
        if(hay.indexOf(q)<0) return false;
      }
      return true;
    }).sort(function(a,b){ return a.y-b.y; });

    $("flGrid").innerHTML = list.length ? list.map(function(s){
      return '<div class="fl-card'+(R[s.id]?" read":"")+'" data-open="'+esc(s.id)+'">'+
        '<div class="fl-bn">'+esc(sTitle(s))+"</div>"+
        '<div class="fl-en">'+esc(sAlt(s))+"</div>"+
        '<div class="fl-meta">'+s.y+" . "+esc(typeName(s.type))+" . "+esc(sSet(s))+"</div></div>";
    }).join("") : '<div class="trend-empty"><div class="te-msg">'+esc(t("empty"))+"</div></div>";

    $("flCount").innerHTML="<b>"+esc(t("showing"))+":</b><span class='muted'> "+list.length+" / "+FL.stories.length+"</span>";
    $("flGrid").querySelectorAll("[data-open]").forEach(function(c){
      c.addEventListener("click", function(){ openStory(c.getAttribute("data-open")); });
    });
  }

  function openStory(id){
    openId=id;
    var s=storyById(id); if(!s) return;
    var feats=s.feat.map(function(f){ return '<span class="fl-tag">'+esc(pName(f))+"</span>"; }).join("");
    var note=sNote(s);
    $("flDetail").innerHTML='<div class="fl-detail">'+
      '<div class="row" style="justify-content:space-between;align-items:flex-start;gap:12px">'+
      "<div><h3 style='font-size:21px;line-height:1.5'>"+esc(sTitle(s))+"</h3>"+
      "<div class='fl-en' style='font-size:14px'>"+esc(sAlt(s))+"</div></div>"+
      '<button class="btn" id="flClose" type="button" style="padding:5px 11px;font-size:12px">&times;</button></div>'+
      '<div style="margin-top:14px">'+
      '<div class="fl-row"><div class="lbl">'+esc(t("lYear"))+"</div><div>"+s.y+"</div></div>"+
      '<div class="fl-row"><div class="lbl">'+esc(t("lType"))+"</div><div>"+esc(typeName(s.type))+"</div></div>"+
      '<div class="fl-row"><div class="lbl">'+esc(t("lSetting"))+"</div><div>"+esc(sSet(s))+" . "+esc(rName(s.r))+"</div></div>"+
      '<div class="fl-row"><div class="lbl">'+esc(t("lPremise"))+"</div><div class='bn-text'>"+esc(sPrem(s))+"</div></div>"+
      (note?'<div class="fl-row"><div class="lbl">'+esc(t("lNotable"))+"</div><div>"+esc(note)+"</div></div>":"")+
      '<div class="fl-row"><div class="lbl">'+esc(t("lFeat"))+"</div><div>"+feats+"</div></div>"+
      "</div>"+
      '<div class="row" style="margin-top:16px"><button class="btn primary" id="flMark" type="button">'+
      esc(R[id] ? t("markUnread") : t("markRead"))+"</button></div></div>";
    $("flClose").addEventListener("click", function(){ openId=null; $("flDetail").innerHTML=""; });
    $("flMark").addEventListener("click", function(){
      R[id]=!R[id]; put(K_R,R); renderGrid(); renderProgress(); openStory(id);
    });
    $("flDetail").scrollIntoView({behavior:"smooth",block:"nearest"});
  }

  /* ---------- orders ---------- */
  function renderOrders(){
    $("orderList").innerHTML = FL.orders.map(function(o){
      var items=o.ids.map(storyById).filter(Boolean).map(function(s,i){
        return '<div class="fl-row"><div class="lbl">'+(i+1)+"</div><div><strong>"+esc(sTitle(s))+
          '</strong><div class="fl-en">'+esc(sAlt(s))+" . "+s.y+"</div></div></div>";
      }).join("");
      return '<div class="an-card full" style="margin-bottom:14px">'+
        "<h3><span class='icon' style='background:rgba(110,168,255,.1);color:#6ea8ff;'>R</span>"+
        esc(L==="bn"?o.bn:o.en)+"</h3>"+
        '<div class="quiz-explain show bn-text" style="margin-bottom:14px">'+esc(L==="bn"?o.dBn:o.dEn)+"</div>"+
        items+"</div>";
    }).join("");
  }

  /* ---------- people ---------- */
  function renderPeople(){
    $("peopleList").innerHTML='<div class="an-card full">'+ FL.people.map(function(p){
      var f=storyById(p.first);
      return '<div class="fl-row"><div class="lbl">'+esc(L==="bn"?p.bn:p.en)+"</div><div>"+
        '<div class="bn-text" style="color:var(--muted)">'+esc(L==="bn"?p.dBn:p.dEn)+"</div>"+
        (f?'<div class="fl-tag" style="margin-top:8px">'+esc(sTitle(f))+" . "+f.y+"</div>":"")+
        "</div></div>";
    }).join("")+"</div>";
  }

  /* ---------- progress ---------- */
  function renderProgress(){
    var read=FL.stories.filter(function(s){ return R[s.id]; });
    var novels=read.filter(function(s){ return s.type==="novel"; }).length;
    var places={}; read.forEach(function(s){ places[s.r]=true; });
    $("pgRead").textContent=read.length;
    $("pgTotal").textContent=FL.stories.length;
    $("pgPct").textContent=Math.round(read.length/FL.stories.length*100)+"%";
    $("pgNovels").textContent=novels;
    $("pgPlaces").textContent=Object.keys(places).length;

    var left=FL.stories.filter(function(s){ return !R[s.id]; }).sort(function(a,b){ return a.y-b.y; });
    $("pgLeft").innerHTML = left.length ? left.map(function(s){
      return '<div class="fl-row"><div class="lbl">'+s.y+"</div><div><strong>"+esc(sTitle(s))+
        '</strong><div class="fl-en">'+esc(sAlt(s))+" . "+esc(sSet(s))+"</div></div></div>";
    }).join("") : '<div class="tiny muted bn-text">'+esc(t("noneLeft"))+"</div>";
  }

  /* ---------- tabs ---------- */
  function switchTab(name){
    document.querySelectorAll(".tab-btn").forEach(function(b){
      b.classList.toggle("active", b.getAttribute("data-tab")===name);
    });
    var map={finder:"viewFinder",order:"viewOrder",people:"viewPeople",progress:"viewProgress"};
    document.querySelectorAll(".view").forEach(function(v){ v.classList.remove("active"); });
    var el=$(map[name]); if(el) el.classList.add("active");
    if(name==="progress") renderProgress();
    window.scrollTo({top:0,behavior:"smooth"});
  }

  document.addEventListener("DOMContentLoaded", function(){
    document.querySelector(".tab-nav").addEventListener("click", function(e){
      var b=e.target.closest(".tab-btn"); if(!b) return;
      switchTab(b.getAttribute("data-tab"));
    });
    $("langToggle").addEventListener("click", function(){
      L = L==="bn" ? "en" : "bn";
      put(K_L,L); applyLang();
    });
    $("flFind").addEventListener("input", renderGrid);
    $("flReset").addEventListener("click", function(){
      fType="All"; fRegion="All"; $("flFind").value="";
      renderFilters(); renderGrid();
    });
    $("pgWipe").addEventListener("click", function(){
      if(!confirm(L==="bn" ? "আপনার পড়ার হিসাব মুছে যাবে। চালিয়ে যাবেন?" : "This will erase your reading record. Continue?")) return;
      R={}; put(K_R,R); renderGrid(); renderProgress();
    });
    applyLang();
  });
})();
</script>

</body>
</html>
